# ============================================================
#  Карта для корректного WebSocket-апгрейда.
#  Файл монтируется прямо в /etc/nginx/conf.d/ (http-контекст).
#  Отдаёт "upgrade" только если клиент его запросил, иначе "close".
# ============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
