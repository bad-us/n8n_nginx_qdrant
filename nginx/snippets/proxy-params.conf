# ============================================================
#  Общие параметры проксирования.
#  Подключается директивой include ВНУТРЬ блока location { }.
# ============================================================

proxy_http_version 1.1;

# Заголовки клиента
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

# WebSocket / SSE — обязательны для живого UI n8n
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Таймауты (n8n держит долгие выполнения через SSE)
proxy_connect_timeout 60s;
proxy_send_timeout    3600s;
proxy_read_timeout    3600s;

# Стриминг ответов без буферизации — нужно для прогресса выполнения workflow
proxy_buffering         off;
proxy_request_buffering off;
proxy_cache             off;
