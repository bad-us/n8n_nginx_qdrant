# ============================================================================
#  n8n + nginx + Qdrant  —  единый стек
#  Все параметры вынесены в .env (см. .env.example)
#
#  Запуск:
#    cp .env.example .env
#    nano .env
#    ./scripts/gen-secrets.sh
#    ./scripts/init-letsencrypt.sh      # выпуск TLS + подъём стека
# ============================================================================

name: ${COMPOSE_PROJECT_NAME}

# ---------------------------------------------------------------------------
#  Ротация логов для всех сервисов (параметры в .env)
# ---------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE}"
    max-file: "${LOG_MAX_FILE}"

# ---------------------------------------------------------------------------
#  Сети
#   edge — выход в интернет (nginx, n8n, certbot)
#   data — изолированная внутренняя сеть без выхода наружу (qdrant, n8n, nginx)
# ---------------------------------------------------------------------------
networks:
  edge:
    name: ${NET_EDGE}
    driver: bridge
  data:
    name: ${NET_DATA}
    driver: bridge
    internal: true

# ---------------------------------------------------------------------------
#  Тома
# ---------------------------------------------------------------------------
volumes:
  n8n_data:
    name: ${VOL_N8N_DATA}
  qdrant_data:
    name: ${VOL_QDRANT_DATA}
  nginx_cache:
    name: ${VOL_NGINX_CACHE}
  letsencrypt:
    name: ${VOL_LETSENCRYPT}
  certbot_www:
    name: ${VOL_CERTBOT_WWW}

services:

  # =========================================================================
  #  QDRANT — векторная БД. Наружу не публикуется, доступ только через nginx
  #  и из n8n по внутренней сети data.
  # =========================================================================
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION}
    container_name: ${QDRANT_CONTAINER_NAME}
    hostname: qdrant
    restart: unless-stopped

    environment:
      TZ: ${TZ}
      # --- API-ключ: обязателен, т.к. сервис доступен из n8n и через nginx ---
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${QDRANT_READONLY_API_KEY}
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL}
      QDRANT__TELEMETRY_DISABLED: "true"
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/snapshots

    volumes:
      - qdrant_data:/qdrant/storage
      - ./data/qdrant/snapshots:/qdrant/snapshots

    networks:
      - data

    expose:
      - "${QDRANT_HTTP_PORT}"
      - "${QDRANT_GRPC_PORT}"

    # Публикация порта наружу — только для отладки, включать осознанно:
    # ports:
    #   - "127.0.0.1:${QDRANT_HTTP_PORT}:${QDRANT_HTTP_PORT}"
    #   - "127.0.0.1:${QDRANT_GRPC_PORT}:${QDRANT_GRPC_PORT}"

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/${QDRANT_HTTP_PORT}' || exit 1"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: 20s

    logging: *default-logging

  # =========================================================================
  #  N8N — платформа автоматизации.
  #  Доступен только через nginx (порт 5678 не публикуется на хост).
  # =========================================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    container_name: ${N8N_CONTAINER_NAME}
    hostname: n8n
    restart: unless-stopped

    depends_on:
      qdrant:
        condition: service_healthy

    environment:
      # --- базовое ---
      TZ: ${TZ}
      GENERIC_TIMEZONE: ${TZ}
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PORT: ${N8N_PORT}
      N8N_PROTOCOL: ${N8N_PROTOCOL}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS}
      WEBHOOK_URL: ${N8N_PROTOCOL}://${N8N_DOMAIN}/
      N8N_EDITOR_BASE_URL: ${N8N_PROTOCOL}://${N8N_DOMAIN}/

      # --- безопасность ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

      # --- поведение / ресурсы ---
      N8N_PAYLOAD_SIZE_MAX: ${N8N_PAYLOAD_SIZE_MAX}
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "true"
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"

      # --- хранение выполнений ---
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${N8N_EXECUTIONS_MAX_AGE}
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"

      # --- БД n8n (SQLite по умолчанию; см. README, раздел про Postgres) ---
      DB_TYPE: sqlite
      DB_SQLITE_POOL_SIZE: "2"

      # --- ДОСТУП К QDRANT из workflow: {{ $env.QDRANT_URL }} / {{ $env.QDRANT_API_KEY }} ---
      QDRANT_URL: http://qdrant:${QDRANT_HTTP_PORT}
      QDRANT_API_KEY: ${QDRANT_API_KEY}

    volumes:
      - n8n_data:/home/node/.n8n
      - ./data/n8n/files:/files

    networks:
      - edge
      - data

    expose:
      - "${N8N_PORT}"

    # Публикация порта наружу — только для отладки:
    # ports:
    #   - "127.0.0.1:${N8N_PORT}:${N8N_PORT}"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${N8N_PORT}/healthz/readiness || wget -q --spider http://127.0.0.1:${N8N_PORT}/healthz || exit 1"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: 60s

    logging: *default-logging

  # =========================================================================
  #  NGINX — единая точка входа (80/443), TLS-терминация, реверс-прокси
  #  на n8n и Qdrant. Конфиги рендерятся из шаблонов с подстановкой .env.
  # =========================================================================
  nginx:
    image: nginx:${NGINX_VERSION}
    container_name: ${NGINX_CONTAINER_NAME}
    hostname: nginx
    restart: unless-stopped

    depends_on:
      n8n:
        condition: service_healthy

    environment:
      TZ: ${TZ}
      # переменные, подставляемые в шаблоны nginx
      N8N_DOMAIN: ${N8N_DOMAIN}
      QDRANT_DOMAIN: ${QDRANT_DOMAIN}
      TLS_CERT_NAME: ${TLS_CERT_NAME}
      N8N_PORT: ${N8N_PORT}
      QDRANT_HTTP_PORT: ${QDRANT_HTTP_PORT}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE}
      NGINX_HSTS_MAX_AGE: ${NGINX_HSTS_MAX_AGE}
      NGINX_ACME_WEBROOT: ${NGINX_ACME_WEBROOT}
      NGINX_TLS_PROTOCOLS: ${NGINX_TLS_PROTOCOLS}
      NGINX_TLS_CIPHERS: ${NGINX_TLS_CIPHERS}
      NGINX_SERVER_TOKENS: ${NGINX_SERVER_TOKENS}

    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"

    volumes:
      # шаблоны конфигов (рендерятся скриптом ниже)
      - ./nginx/templates:/etc/nginx/templates-app:ro
      # статические фрагменты
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # map для WebSocket (http-контекст)
      - ./nginx/conf.d/00-upgrade-map.conf:/etc/nginx/conf.d/00-upgrade-map.conf:ro
      # хук entrypoint: рендер конфигов при старте
      - ./nginx/docker-entrypoint.d/25-render-confs.sh:/docker-entrypoint.d/25-render-confs.sh:ro
      # опциональный basic-auth на Qdrant
      - ./nginx/htpasswd:/etc/nginx/htpasswd:ro
      # сертификаты Let's Encrypt (ro)
      - letsencrypt:/etc/letsencrypt:ro
      # webroot для ACME-челленджа
      - certbot_www:${NGINX_ACME_WEBROOT}:ro
      - nginx_cache:/var/cache/nginx

    networks:
      - edge
      - data

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}
      start_period: 10s

    logging: *default-logging

  # =========================================================================
  #  CERTBOT — выпуск (разово через scripts/init-letsencrypt.sh) и
  #  автопродление сертификатов. Запускается только с профилем tls:
  #      docker compose --profile tls up -d
  # =========================================================================
  certbot:
    image: certbot/certbot:${CERTBOT_VERSION}
    container_name: ${CERTBOT_CONTAINER_NAME}
    restart: unless-stopped
    profiles: ["tls"]

    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w ${NGINX_ACME_WEBROOT} --quiet
          sleep 12h & wait $${!}
        done

    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:${NGINX_ACME_WEBROOT}

    networks:
      - edge

    logging: *default-logging
